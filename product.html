<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product | JK Krishi Vikas Cooperative Ltd</title>
<meta name="description" content="Genuine agriculture machinery with warranty, service and spares from JK Krishi Vikas Cooperative Ltd, Kashmir.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
<div id="header"></div>
<div class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="pd" id="pd"></div>
</div>
<section class="alt"><div class="wrap">
  <span class="overline">You may also need</span>
  <h2 class="sec-title">Related products</h2>
  <div class="p-grid" id="relGrid"></div>
</div></section>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
window.pageInit = () => {
  const id = new URLSearchParams(location.search).get('id') || 'h125';
  const p = PRODUCTS.find(x=>x.id===id) || PRODUCTS[0];
  const off = p.mrp ? Math.round((1-p.price/p.mrp)*100) : 0;
  document.title = `${p.name} — JK Krishi Vikas Cooperative Ltd`;
  $('#crumbs').innerHTML = `<a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <a href="shop.html?cat=${encodeURIComponent(p.cat)}">${p.cat}</a> / <b>${p.name}</b>`;

  const imgs = [p.img || PH, 'img/orchard-2.jpg'].filter(Boolean);
  $('#pd').innerHTML = `
  <div class="pd-gallery">
    <div class="main"><img id="mainImg" src="${imgs[0]}" alt="${p.name}" onerror="this.onerror=null;this.src='${PH}'"></div>
    <div class="pd-thumbs">${imgs.map((s,i)=>`<img src="${s}" class="${i===0?'on':''}" onclick="swapImg(this,'${s}')" alt="View ${i+1}">`).join('')}</div>
  </div>
  <div>
    <span class="p-brand">${p.brand} · ${p.cat}</span>
    <h1>${p.name}</h1>
    <div class="meta"><span class="stars">★★★★★</span><span>4.8 · 126 ratings</span><span>·</span><span style="color:var(--green);font-weight:700">In stock</span></div>
    <div class="price-row"><b>${money(p.price)}</b>${p.mrp?`<s>${money(p.mrp)}</s><span class="off">${off}% off</span>`:''}</div>
    <div class="gst">Inclusive of GST · Free delivery in Srinagar above ₹999 · EMI / UPI / COD available</div>
    <div class="offer-strip">🎁 Festival offer: free first service + 1L 2T oil with every petrol machine this month.</div>
    <div class="qty-row">
      <div class="qty"><button onclick="step(-1)" aria-label="Decrease">−</button><input id="qty" value="1" readonly aria-label="Quantity"><button onclick="step(1)" aria-label="Increase">+</button></div>
      <button class="btn" onclick="addToCart('${p.id}', +document.getElementById('qty').value)">Add to Cart</button>
      <a class="btn ghost" href="cart.html?quote=1">Get Dealer Quote</a>
    </div>
    <div class="trust-row">
      <div class="t"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg>100% Genuine</div>
      <div class="t"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>Brand Warranty</div>
      <div class="t"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>Valley Delivery</div>
      <div class="t"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4L15 12l-3-3 2.7-2.7Z"/></svg>Service & Spares</div>
    </div>
    <h3 style="color:var(--blue);font-size:15px">Specifications</h3>
    <table class="spec-table"><tbody>
      ${Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
      <tr><td>SKU</td><td>JKKVC-${p.id.toUpperCase()}</td></tr>
      <tr><td>Availability</td><td style="color:var(--green);font-weight:700">In stock at Lalmandi + ${3+ (p.id.length % 5)} showrooms</td></tr>
    </tbody></table>
  </div>`;
  const rel = PRODUCTS.filter(x=>x.cat===p.cat && x.id!==p.id).slice(0,4);
  const fill = rel.length<4 ? rel.concat(PRODUCTS.filter(x=>x.cat!==p.cat).slice(0,4-rel.length)) : rel;
  renderGrid($('#relGrid'), fill);
};
window.step = d => { const q=$('#qty'); q.value = Math.max(1, +q.value + d); };
window.swapImg = (el, src) => { $('#mainImg').src = src; $$('.pd-thumbs img').forEach(i=>i.classList.remove('on')); el.classList.add('on'); };
</script>
</body>
</html>
